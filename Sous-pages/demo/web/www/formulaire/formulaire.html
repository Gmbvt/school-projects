        <main>
        
        <form method = "POST" id = formulaire>
            <h2>Formulaire d'inscription</h2>
            <div class = "entree">
                <label for="lastname">Le super nom de famille&nbsp;:</label>
                <input type = "text" id = "lastname" placeholder = "DUPONT" required>
            </div>
            <div class = "entree">
                <label for="firstname">L'extraordinaire prénom&nbsp;:</label>
                <input type = "text" id = "firstname" placeholder = "Pierre" required/>
            </div>
            <div class = "entree">
                <label for="useremail">L'incroyable adresse courriel&nbsp;:</label>
                <input type = "email" id = "useremail" placeholder = "bonjour@exemple.test" required/>
            </div>
            <div class = "entree">
                <label for="username">Le sublime nom d'utilisateur&nbsp;:</label>
                <input type = "text" id = "username" placeholder = "6 caractères minimum"/>
            </div>
            <div class = "entree">
                <label for="userpwd">L'intrépide mot de mot de passe&nbsp;:</label>
                <input type = "password" id = "userpwd" required/>
            </div>
            <div class = "entree">
                <label for="birthdate">L'unique date de naissance&nbsp;:</label>
                <input type = "date" id = "birthdate"/>
            </div>
            <button>Soumettre</button>
            <span id = "erreur"></span>
        </form>
        <article>
            <h2>Merci </h2>
            <p></p>
        </article>
